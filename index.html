<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MaxStudy</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb;}
header{background:#1e3a8a;color:white;text-align:center;padding:20px;font-size:32px;font-weight:bold;}
.container{max-width:1000px;margin:30px auto;padding:20px;}
h2{color:#1e3a8a;}
button{display:block;width:360px;padding:14px;margin:10px 0;border:none;border-radius:8px;background:#2563eb;color:white;font-size:16px;cursor:pointer;}
button:hover{background:#1d4ed8;}
</style>
</head>

<body>
<header>MaxStudy</header>

<div class="container">
<h2>Math</h2>

<button onclick="openPDF('math-number.pdf')">Unit 1: Number</button>
<button onclick="openPDF('math-algebra.pdf')">Unit 2: Algebra</button>
<button onclick="openPDF('math-lengths-areas-volumes.pdf')">Unit 3: Lengths, Areas & Volumes</button>
<button onclick="openPDF('math-pythagoras.pdf')">Unit 4: Pythagoras</button>
<button onclick="openPDF('math-geometry.pdf')">Unit 5: Geometry</button>
<button onclick="openPDF('math-coordinate-geometry.pdf')">Unit 6: Coordinate Geometry</button>
</div>

<script>
function openPDF(file){
  window.open(file, "_blank");
}
</script>

</body>
</html>
